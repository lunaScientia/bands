name: Build and check BANDS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the standalone device
        run: python3 build.py
      - name: Check audio graph and frequency response
        run: python3 tests/verify.py
      - name: Check solo and mute control behavior
        run: node tests/controller.js
      - name: Check band printing and Live coordination
        run: |
          node tests/print_worker.js
          node tests/print_controller.js
      - name: Check renderer state and allocations
        run: node --expose-gc tests/renderer.js
      - name: Check frozen package
        run: python3 tests/verify_package.py
      - name: Upload single-file device
        uses: actions/upload-artifact@v4
        with:
          name: BANDS-device
          path: dist/Standalone/BANDS.amxd
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: tests/*-results.json
